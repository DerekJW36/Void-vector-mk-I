<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoidVector Mk I — DGC SYNTECK AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06090f; }
    canvas { display: block; }

    :root {
      --cyan:  #00c8ff;
      --dim:   #2a4a6a;
      --gold:  #c8a84b;
      --bg:    rgba(6,9,15,0.82);
      --mono:  'Courier New', monospace;
    }

    /* ── TOP-LEFT FLIGHT DATA ─────────────────────────────── */
    #hud-flight {
      position: fixed; top: 20px; left: 20px;
      font-family: var(--mono); font-size: 11px;
      letter-spacing: 0.1em; color: var(--cyan);
      pointer-events: none; user-select: none;
    }
    .hud-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: baseline; }
    .hud-lbl { color: var(--dim); font-size: 9px; letter-spacing: 0.15em; min-width: 36px; }
    .hud-val { color: var(--cyan); font-size: 13px; font-weight: bold; min-width: 64px; }
    #cam-mode { color: var(--gold); font-size: 10px; }

    /* ── TOP-RIGHT SPEC STRIP ─────────────────────────────── */
    #hud-spec {
      position: fixed; top: 20px; right: 20px;
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.08em; color: var(--dim);
      text-align: right; pointer-events: none;
      line-height: 1.7;
    }
    #hud-spec span { color: var(--cyan); }

    /* ── BOTTOM CONTROLS LEGEND ───────────────────────────── */
    #controls {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
      pointer-events: none;
    }
    .key-block {
      background: var(--bg); border: 1px solid var(--dim);
      border-radius: 4px; padding: 4px 8px;
      font-family: var(--mono); font-size: 9px;
      letter-spacing: 0.1em; color: var(--dim);
      display: flex; align-items: center; gap: 5px;
    }
    .key-block kbd {
      background: #0d1f33; border: 1px solid #1a3a55;
      border-radius: 3px; padding: 2px 5px;
      color: var(--cyan); font-size: 9px; font-family: var(--mono);
    }

    /* ── BADGE ────────────────────────────────────────────── */
    #badge {
      position: fixed; bottom: 20px; right: 20px;
      font-family: var(--mono); font-size: 9px;
      letter-spacing: 0.12em; color: var(--gold);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Flight data -->
  <div id="hud-flight">
    <div class="hud-row">
      <span class="hud-lbl">ALT</span>
      <span class="hud-val" id="hud-alt">0.6 m</span>
    </div>
    <div class="hud-row">
      <span class="hud-lbl">SPD</span>
      <span class="hud-val" id="hud-spd">0.0 m/s</span>
    </div>
    <div class="hud-row">
      <span class="hud-lbl">HDG</span>
      <span class="hud-val" id="hud-hdg">000°</span>
    </div>
    <div class="hud-row">
      <span class="hud-lbl">CAM</span>
      <span class="hud-val" id="cam-mode">FOLLOW</span>
    </div>
  </div>

  <!-- Spec strip -->
  <div id="hud-spec">
    VOIDVECTOR MK I<br>
    <span>4× 76mm EDF</span> · TETRAHEDRAL FRAME<br>
    MAX THRUST <span>74 N</span> · TWR <span>2.69:1</span><br>
    GIMBAL <span>±22° / 2-AXIS</span>
  </div>

  <!-- Controls legend -->
  <div id="controls">
    <div class="key-block"><kbd>W</kbd><kbd>S</kbd> FWD / REV</div>
    <div class="key-block"><kbd>A</kbd><kbd>D</kbd> STRAFE</div>
    <div class="key-block"><kbd>Q</kbd><kbd>E</kbd> YAW</div>
    <div class="key-block"><kbd>SPC</kbd> ASCEND</div>
    <div class="key-block"><kbd>⇧</kbd> DESCEND</div>
    <div class="key-block"><kbd>C</kbd> CAMERA</div>
    <div class="key-block"><kbd>R</kbd> RESET</div>
  </div>

  <div id="badge">DGC SYNTECK AI — ENGINEERING DIVISION — V1.0</div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
